name: Publish SDK

on:
  push:
    tags:
       - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Derive version
        run: echo "FDK_PUBLISH_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          FDK_PUBLISH_VERSION: ${{ env.FDK_PUBLISH_VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          find . -path '*/build/outputs/aar/*-release.aar' | while read -r aar; do
            module=$(basename "$aar" -release.aar)
            cp "$aar" "release-artifacts/${module}-${FDK_PUBLISH_VERSION}.aar"
          done

      - name: Generate release notes
        run: |
          {
            echo "## Maven Central"
            echo
            echo "[![Maven Central](https://img.shields.io/badge/Maven_Central-${FDK_PUBLISH_VERSION}-blue?logo=apachemaven)](https://central.sonatype.com/artifact/io.github.truegrom/bom/${FDK_PUBLISH_VERSION})"
            echo
            echo '```kotlin'
            echo "implementation(platform(\"io.github.truegrom:bom:${FDK_PUBLISH_VERSION}\"))"
            echo '```'
            echo
            echo "| Module | Coordinates |"
            echo "| --- | --- |"
            for module in bom $(ls release-artifacts | sed "s/-${FDK_PUBLISH_VERSION}\.aar//"); do
              echo "| [\`${module}\`](https://central.sonatype.com/artifact/io.github.truegrom/${module}/${FDK_PUBLISH_VERSION}) | \`io.github.truegrom:${module}:${FDK_PUBLISH_VERSION}\` |"
            done
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes
