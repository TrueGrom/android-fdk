name: Publish Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # need tags to derive the snapshot version

      - uses: ./.github/actions/setup-corretto

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Derive snapshot version
        run: |
          LATEST=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo v0.0.0)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          echo "FDK_PUBLISH_VERSION=$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Publish snapshot to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          FDK_PUBLISH_VERSION: ${{ env.FDK_PUBLISH_VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
